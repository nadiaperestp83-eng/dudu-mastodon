name: Build app
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  Build-Apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: '11'
      - uses: subosito/flutter-action@v1.4.0
        with:
          flutter-version: '1.22.6'
          channel: 'stable'
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r20b
          add-to-path: false
          local-cache: true
      - name: Write local.properties
        run: echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" > android/local.properties
      - name: Debug pubspec
        run: |
          echo "===== pubspec.yaml ====="
          cat pubspec.yaml
          echo "===== busca cached_video_player/chewie no pubspec.lock ====="
          grep -B2 -A5 "cached_video_player\|chewie" pubspec.lock || echo "NAO ENCONTRADO no pubspec.lock"
      - name: Build
        env:
          MASTODON_CLIENT_ID: ${{ secrets.MASTODON_CLIENT_ID }}
          MASTODON_CLIENT_SECRET: ${{ secrets.MASTODON_CLIENT_SECRET }}
          MASTODON_REDIRECT_URI: ${{ secrets.MASTODON_REDIRECT_URI }}
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter build apk --debug \
            --dart-define=MASTODON_CLIENT_ID=$MASTODON_CLIENT_ID \
            --dart-define=MASTODON_CLIENT_SECRET=$MASTODON_CLIENT_SECRET \
            --dart-define=MASTODON_REDIRECT_URI=$MASTODON_REDIRECT_URI
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/apk/debug/app-debug.apk
